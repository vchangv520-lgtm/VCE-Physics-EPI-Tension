<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>String Tension Setup</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]] },
      svg: { fontCache: "global" },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #16181d;
      --muted: #69717d;
      --paper: #f8f7f3;
      --line: #1f6f9f;
      --line-soft: rgba(31, 111, 159, 0.18);
      --brass: #c7983d;
      --red: #a7372f;
      --green: #55785b;
      --bench: #76624f;
      --metal: #555b61;
      --shadow: rgba(22, 24, 29, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .film {
      position: relative;
      width: min(100vw, 1500px);
      height: min(100vh, 920px);
      min-height: 620px;
      overflow: hidden;
      cursor: pointer;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(248, 247, 243, 0.96) 44%, #f3f0e9 100%);
    }

    .film::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 24%;
      background: linear-gradient(180deg, rgba(248, 247, 243, 0), rgba(231, 225, 214, 0.68));
      pointer-events: none;
    }

    .film:focus {
      outline: none;
    }

    .narrative {
      position: absolute;
      z-index: 4;
      left: var(--caption-x, clamp(32px, 6vw, 92px));
      right: auto;
      top: var(--caption-y, clamp(26px, 5.4vh, 54px));
      width: var(--caption-w, min(590px, calc(100vw - 64px)));
      pointer-events: none;
      transition: left 900ms cubic-bezier(.2,.8,.2,1), top 900ms cubic-bezier(.2,.8,.2,1), width 900ms cubic-bezier(.2,.8,.2,1);
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: clamp(12px, 1.1vw, 14px);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      max-width: 560px;
      /* The 84px reservation is shared with the collapse animation; the font
         must always fit inside it (2 lines) so nothing below ever shifts. */
      max-height: calc(var(--title-o, 1) * 84px);
      overflow: hidden;
      font-size: clamp(26px, 2.75vw, 38px);
      line-height: 1.05;
      text-wrap: balance;
      font-weight: 760;
      opacity: var(--title-o, 1);
      transform: scale(var(--title-scale, 1));
      transform-origin: left top;
      transition: opacity 700ms ease, transform 900ms cubic-bezier(.2,.8,.2,1), max-height 700ms ease;
    }

    .line {
      margin: 18px 0 0;
      max-width: 500px;
      color: #323740;
      font-size: var(--line-size, clamp(17px, 1.65vw, 23px));
      line-height: 1.34;
      font-weight: 430;
      min-height: 3.7em;
      text-wrap: balance;
      transition: opacity 460ms ease, transform 460ms ease;
    }

    .formula-card {
      position: absolute;
      z-index: 5;
      left: var(--formula-x, 7vw);
      top: var(--formula-y, 70vh);
      width: min(var(--formula-w, 360px), calc(100vw - 64px));
      color: var(--ink);
      opacity: var(--formula-o, 0);
      transform: translateY(calc((1 - var(--formula-o, 0)) * 10px));
      transition: opacity 500ms ease, transform 500ms ease, left 900ms cubic-bezier(.2,.8,.2,1), top 900ms cubic-bezier(.2,.8,.2,1), width 900ms cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }

    .formula-card .math {
      font-size: clamp(15px, 1.25vw, 19px);
      line-height: 1.15;
      font-weight: 680;
    }

    .formula-card mjx-container {
      font-size: var(--formula-math-size, 50%) !important;
      margin: 0 !important;
    }

    .formula-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1.05vw, 15px);
      line-height: 1.38;
    }

    .line.fading {
      opacity: 0;
      transform: translateY(8px);
    }

    .counter {
      position: absolute;
      top: 8px;
      /* Sit flush with the caption's right edge, but never closer than 464px
         to its left edge so the chip clears the kicker on narrow captions. */
      right: min(0px, calc(var(--caption-w, 560px) - 464px));
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .counter span {
      display: block;
      width: 92px;
      height: 1px;
      background: rgba(22, 24, 29, 0.18);
      transform-origin: left center;
    }

    .counter span::after {
      content: "";
      display: block;
      height: 1px;
      width: calc(var(--chapter-progress, 0) * 100%);
      background: var(--ink);
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform: translateY(72px);
      transform-origin: center bottom;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #cameraLayer {
      transform: translate(var(--cam-x, 0px), var(--cam-y, 0px)) scale(var(--cam-s, 1));
      transform-box: view-box;
      transform-origin: 0 0;
      transition: transform 1100ms cubic-bezier(.18,.82,.18,1);
    }

    .soft-shadow {
      filter: drop-shadow(0 18px 18px var(--shadow));
    }

    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: calc(1 - var(--draw, 0));
    }

    /* Elastic stretch: the tail scales about the pulley exit while the mass
       carriage translates by the same extension; both transforms share one
       duration and easing so the hook stays attached mid-transition. */
    #stringTail {
      transform-box: view-box;
      transform-origin: 1094px 461px;
      transition: transform 900ms cubic-bezier(.2, .8, .2, 1), stroke-width 900ms ease;
    }

    #massCarriage {
      transition: transform 900ms cubic-bezier(.2, .8, .2, 1);
    }

    #stringMain,
    #stringGhost {
      transition: stroke-width 900ms ease;
    }

    .part {
      opacity: var(--o, 0);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 760ms ease, transform 900ms cubic-bezier(.2,.8,.2,1);
    }

    .rise {
      transform: translateY(calc((1 - var(--o, 0)) * 24px));
    }

    .settle {
      animation: settle 6.6s ease-in-out infinite;
      animation-delay: 3.2s;
    }

    .mass-sway {
      transform-box: fill-box;
      transform-origin: top center;
      animation: massSway 6.6s ease-in-out infinite;
      animation-delay: 4.6s;
    }

    .string-vibrate {
      opacity: var(--vibe, 0);
    }

    .string-envelope {
      opacity: calc(var(--vibe, 0) * 0.22);
      transition: opacity 420ms ease;
    }

    .phone-glow {
      opacity: var(--phone-glow, 0);
      animation: phoneGlow 1.8s ease-in-out infinite;
    }

    .phone-ui {
      opacity: var(--phone-glow, 0);
      transition: opacity 500ms ease;
    }

    .phone-small {
      fill: #5e6874;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .phone-frequency {
      fill: #171a1f;
      font-size: 17px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .phone-peak {
      fill: none;
      stroke: var(--red);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 70;
      animation: peakTrace 1.8s ease-in-out infinite;
    }

    .mass-layer {
      opacity: var(--layer-o, 0);
      transition: opacity 440ms ease;
    }

    .mass-labels {
      opacity: var(--o, 0);
      transition: opacity 500ms ease;
    }

    .wavebar {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: bars 900ms ease-in-out infinite;
      opacity: var(--phone-glow, 0);
    }

    .marker {
      opacity: var(--marker, 0);
      transform-box: fill-box;
      transform-origin: center;
      animation: markerBreath 1.8s ease-in-out infinite;
    }

    .caption-label {
      font-size: 15px;
      fill: var(--muted);
      font-weight: 520;
    }

    .caption-strong {
      font-size: 18px;
      fill: var(--ink);
      font-weight: 650;
    }

    .fine {
      font-size: 13px;
      fill: var(--muted);
      font-weight: 480;
    }

    .formula {
      font-size: 17px;
      fill: var(--red);
      font-weight: 650;
    }

    .fade-in {
      opacity: var(--o, 0);
      transition: opacity 700ms ease;
    }

    .endnote {
      display: none;
      position: absolute;
      z-index: 3;
      left: clamp(32px, 6vw, 92px);
      bottom: clamp(28px, 6vh, 72px);
      width: min(560px, calc(100vw - 64px));
      color: #3f4650;
      font-size: clamp(15px, 1.4vw, 19px);
      line-height: 1.45;
      opacity: var(--endnote, 0);
      transform: translateY(calc((1 - var(--endnote, 0)) * 14px));
      transition: opacity 700ms ease, transform 700ms ease;
      pointer-events: none;
    }

    @keyframes settle {
      0%, 100% { transform: translateY(0); }
      42% { transform: translateY(0); }
      48% { transform: translateY(6px); }
      58% { transform: translateY(-2px); }
      68% { transform: translateY(0); }
    }

    @keyframes massSway {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(0deg); }
      54% { transform: rotate(1.2deg); }
      68% { transform: rotate(-0.7deg); }
      80% { transform: rotate(0deg); }
    }

    @keyframes stringPulse {
      0%, 100% { transform: translateY(0) scaleY(1); opacity: calc(var(--vibe, 0) * 0.76); }
      50% { transform: translateY(-3px) scaleY(1.08); opacity: var(--vibe, 0); }
    }

    @keyframes phoneGlow {
      0%, 100% { opacity: calc(var(--phone-glow, 0) * 0.52); }
      50% { opacity: var(--phone-glow, 0); }
    }

    @keyframes bars {
      0%, 100% { transform: scaleY(0.34); }
      28% { transform: scaleY(0.82); }
      56% { transform: scaleY(0.48); }
      78% { transform: scaleY(1); }
    }

    @keyframes peakTrace {
      0% { stroke-dashoffset: 70; opacity: 0.32; }
      46% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.58; }
    }

    @keyframes markerBreath {
      0%, 100% { transform: scale(1); opacity: calc(var(--marker, 0) * 0.68); }
      50% { transform: scale(1.08); opacity: var(--marker, 0); }
    }

    @media (max-width: 760px) {
      html,
      body {
        overflow: auto;
      }

      .film {
        min-height: 760px;
      }

      .narrative {
        top: 24px;
      }

      .counter {
        position: static;
        margin-top: 12px;
      }

      .stage {
        transform: translateY(92px) scale(1.18);
        transform-origin: center bottom;
      }

      h1 {
        max-width: 500px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="film" tabindex="0" aria-label="Interactive setup for a string tension and frequency experiment">
    <section class="narrative" aria-live="polite">
      <div>
        <p class="kicker">String tension experiment</p>
        <h1>Build the tension before listening for frequency.</h1>
        <p class="line" id="narration">A clear bench becomes the reference line for the whole setup.</p>
      </div>
      <div class="counter" aria-hidden="true">
        <span></span>
        <b id="chapter">01 / 13</b>
      </div>
    </section>

    <aside class="formula-card" id="formulaCard" aria-live="polite">
      <div class="math" id="formulaText"></div>
      <p id="formulaNote"></p>
    </aside>

    <div class="stage" aria-hidden="true">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="benchWood" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#8a7561"></stop>
            <stop offset="0.55" stop-color="#6f5a47"></stop>
            <stop offset="1" stop-color="#86705c"></stop>
          </linearGradient>
          <linearGradient id="brassMass" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#e2bf6d"></stop>
            <stop offset="1" stop-color="#bc8f37"></stop>
          </linearGradient>
          <clipPath id="phoneScreen">
            <rect x="644" y="588" width="58" height="104" rx="8"></rect>
          </clipPath>
        </defs>

        <g id="cameraLayer">
        <rect x="-80" y="800" width="1600" height="120" fill="#e8e1d4"></rect>

        <g class="part rise soft-shadow" id="bench" style="--o: 0">
          <rect x="120" y="465" width="1030" height="26" rx="2" fill="url(#benchWood)"></rect>
          <rect x="176" y="491" width="28" height="240" fill="#5a4a3d"></rect>
          <rect x="1080" y="491" width="28" height="212" fill="#5a4a3d"></rect>
          <text x="136" y="447" class="caption-strong">bench</text>
        </g>

        <g class="part rise" id="supports" style="--o: 0">
          <rect x="210" y="370" width="28" height="120" rx="2" fill="var(--metal)"></rect>
          <rect x="852" y="370" width="28" height="120" rx="2" fill="var(--metal)"></rect>
          <rect x="194" y="356" width="60" height="16" rx="2" fill="#737b82"></rect>
          <rect x="836" y="356" width="60" height="16" rx="2" fill="#737b82"></rect>
          <text x="148" y="337" class="caption-label">fixed support</text>
          <text x="798" y="337" class="caption-label">bridge support</text>
        </g>

        <g class="part rise" id="pulley" style="--o: 0">
          <line x1="1040" y1="407" x2="1040" y2="306" stroke="#555b61" stroke-width="12" stroke-linecap="round"></line>
          <circle cx="1040" cy="461" r="54" fill="#f8f7f3" stroke="var(--ink)" stroke-width="5"></circle>
          <circle cx="1040" cy="461" r="8" fill="var(--ink)"></circle>
          <path d="M1040 407 A54 54 0 0 1 1094 461" fill="none" stroke="#9aa0a6" stroke-width="7" stroke-linecap="round"></path>
          <text x="992" y="328" class="caption-label">low-friction pulley</text>
        </g>

        <g id="stringGroup">
          <path id="stringMain" class="draw" pathLength="1" d="M224 407 H866 H1040 A54 54 0 0 1 1094 461" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="--draw: 0"></path>
          <line id="stringTail" class="draw" pathLength="1" x1="1094" y1="461" x2="1094" y2="590" stroke="var(--line)" stroke-width="7" stroke-linecap="round" style="--draw: 0"></line>
          <path id="stringEnvelopeUp" class="string-envelope" d="M224 407 C385 344 705 344 866 407" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 10" stroke-linecap="round" style="--vibe: 0"></path>
          <path id="stringEnvelopeDown" class="string-envelope" d="M224 407 C385 470 705 470 866 407" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="9 10" stroke-linecap="round" style="--vibe: 0"></path>
          <path id="stringGhost" class="string-vibrate" d="M224 407 C385 344 705 344 866 407" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round" style="--vibe: 0"></path>
          <path id="stringRest" d="M224 407 H866" fill="none" stroke="rgba(31,111,159,0.18)" stroke-width="18" stroke-linecap="round" opacity="0.0"></path>
        </g>

        <g class="fade-in" id="lengthBracket" style="--o: 0">
          <line x1="224" y1="342" x2="866" y2="342" stroke="var(--red)" stroke-width="3"></line>
          <line x1="224" y1="324" x2="224" y2="360" stroke="var(--red)" stroke-width="3"></line>
          <line x1="866" y1="324" x2="866" y2="360" stroke="var(--red)" stroke-width="3"></line>
          <text x="545" y="320" text-anchor="middle" class="formula">fixed vibrating length</text>
        </g>

        <g id="massCarriage">
        <g class="part mass-sway soft-shadow" id="mass" style="--o: 0">
          <line x1="1094" y1="590" x2="1094" y2="608" stroke="#71521d" stroke-width="4" stroke-linecap="round"></line>
          <path d="M1058 608 H1130 L1118 658 H1070 Z" fill="url(#brassMass)" stroke="#71521d" stroke-width="3"></path>
          <rect class="mass-layer" data-layer="1" x="1032" y="672" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="2" x="1032" y="687" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="3" x="1032" y="702" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="4" x="1032" y="717" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="5" x="1032" y="732" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="6" x="1032" y="747" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <rect class="mass-layer" data-layer="7" x="1032" y="762" width="124" height="11" rx="2" fill="url(#brassMass)" stroke="#71521d" stroke-width="2"></rect>
          <g class="mass-labels" id="massLabels" style="--o: 0">
          <text x="1126" y="632" class="caption-strong">hanging mass</text>
          <text x="1126" y="657" class="formula">known tension</text>
          <text x="1126" y="686" class="fine" id="massCount">mass set 1 / 7</text>
          </g>
        </g>
        </g>

        <g class="fade-in" id="tensionArrow" style="--o: 0">
          <path d="M918 386 C950 360 984 358 1014 384" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round"></path>
          <path d="M1014 384 L997 382 L1006 369" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <text x="846" y="362" class="caption-label" fill="var(--green)">known tension</text>
        </g>

        <g class="fade-in" id="midpoint" style="--o: 0">
          <circle class="marker" cx="545" cy="407" r="9" fill="var(--red)" style="--marker: 0"></circle>
          <path d="M545 407 C545 432 545 454 545 473" fill="none" stroke="var(--red)" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"></path>
        </g>

        <g class="part rise soft-shadow" id="phone" style="--o: 0">
          <rect x="630" y="570" width="86" height="146" rx="13" fill="#181a1f"></rect>
          <rect x="644" y="588" width="58" height="104" rx="8" fill="#1f2530"></rect>
          <g clip-path="url(#phoneScreen)">
            <rect x="644" y="588" width="58" height="104" fill="#dfe9f5"></rect>
            <text class="phone-small phone-ui" x="673" y="604" text-anchor="middle">peak</text>
            <text class="phone-frequency phone-ui" id="phoneFreq" x="673" y="622" text-anchor="middle">-- Hz</text>
            <rect class="wavebar" x="653" y="656" width="6" height="28" rx="3" fill="var(--line)" style="animation-delay: 0ms"></rect>
            <rect class="wavebar" x="664" y="634" width="6" height="50" rx="3" fill="var(--red)" style="animation-delay: 80ms"></rect>
            <rect class="wavebar" x="675" y="644" width="6" height="40" rx="3" fill="var(--green)" style="animation-delay: 160ms"></rect>
            <rect class="wavebar" x="686" y="624" width="6" height="60" rx="3" fill="var(--line)" style="animation-delay: 240ms"></rect>
          </g>
          <rect class="phone-glow" x="618" y="558" width="110" height="170" rx="20" fill="none" stroke="var(--line)" stroke-width="3" style="--phone-glow: 0"></rect>
          <text x="548" y="755" class="caption-label">spectrum app listens for the fundamental frequency</text>
        </g>

        <g class="fade-in" id="sound" style="--o: 0">
          <path d="M585 596 C530 560 504 514 497 470" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 9" opacity="0.65"></path>
          <path d="M618 595 C574 535 562 490 565 447" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="7 9" opacity="0.45"></path>
        </g>

        <g class="fade-in" id="finalLabels" style="--o: 0">
          <text x="238" y="534" class="fine">support fixes one end</text>
          <text x="790" y="534" class="fine">bridge fixes the measured length</text>
          <text x="1045" y="592" class="fine">mass supplies tension</text>
        </g>

        <g class="fade-in" id="recordBadge" style="--o: 0">
          <text x="748" y="622" class="caption-strong" id="recordNumber">record 1 / 7</text>
          <text x="748" y="648" class="fine">measure the peak, add mass, repeat</text>
        </g>
        </g>
      </svg>
    </div>

    <p class="endnote" id="endnote">
      The apparatus is ready when the length is fixed, the tension is known, and every pluck begins from the same small displacement.
    </p>
  </main>

  <script>
    const root = document.documentElement;
    const film = document.querySelector(".film");
    const narration = document.getElementById("narration");
    const chapter = document.getElementById("chapter");

    const parts = {
      bench: document.getElementById("bench"),
      supports: document.getElementById("supports"),
      pulley: document.getElementById("pulley"),
      stringMain: document.getElementById("stringMain"),
      lengthBracket: document.getElementById("lengthBracket"),
      mass: document.getElementById("mass"),
      tensionArrow: document.getElementById("tensionArrow"),
      massLabels: document.getElementById("massLabels"),
      midpoint: document.getElementById("midpoint"),
      phone: document.getElementById("phone"),
      sound: document.getElementById("sound"),
      finalLabels: document.getElementById("finalLabels"),
      recordBadge: document.getElementById("recordBadge"),
      cameraLayer: document.getElementById("cameraLayer"),
      stringGhost: document.getElementById("stringGhost"),
      stringTail: document.getElementById("stringTail"),
      massCarriage: document.getElementById("massCarriage"),
      stringEnvelopeUp: document.getElementById("stringEnvelopeUp"),
      stringEnvelopeDown: document.getElementById("stringEnvelopeDown"),
      marker: document.querySelector(".marker"),
      phoneFreq: document.getElementById("phoneFreq"),
      wavebars: [...document.querySelectorAll(".wavebar")],
      massLayers: [...document.querySelectorAll(".mass-layer")],
      massCount: document.getElementById("massCount"),
      recordNumber: document.getElementById("recordNumber"),
      formulaCard: document.getElementById("formulaCard"),
      formulaText: document.getElementById("formulaText"),
      formulaNote: document.getElementById("formulaNote")
    };

    const base = {
      bench: 1,
      supports: 1,
      pulley: 1,
      draw: 1,
      bracket: 0,
      mass: 1,
      tension: 0,
      midpoint: 1,
      phone: 1,
      sound: 1,
      final: 0,
      record: 1,
      vibe: 1,
      marker: 1,
      glow: 1,
      massLabels: 0,
      massLevel: 1,
      recordLevel: 1
    };

    const scenes = [
      {
        text: "A clear bench becomes the reference line for the whole setup.",
        values: { bench: 1, supports: 0, pulley: 0, draw: 0, bracket: 0, mass: 0, tension: 0, midpoint: 0, phone: 0, sound: 0, final: 0, record: 0, vibe: 0, marker: 0, glow: 0, massLevel: 0, recordLevel: 0 }
      },
      {
        text: "Two supports define the vibrating length of the string.",
        values: { bench: 1, supports: 1, pulley: 0, draw: 0.16, bracket: 0, mass: 0, tension: 0, midpoint: 0, phone: 0, sound: 0, final: 0, record: 0, vibe: 0, marker: 0, glow: 0, massLevel: 0, recordLevel: 0 }
      },
      {
        text: "The string stays horizontal, then rests over the top of the pulley before dropping down.",
        values: { bench: 1, supports: 1, pulley: 1, draw: 1, bracket: 0, mass: 0.28, tension: 0, midpoint: 0, phone: 0, sound: 0, final: 0, record: 0, vibe: 0, marker: 0, glow: 0, massLevel: 0, recordLevel: 0 }
      },
      {
        text: "The measured length is fixed once and kept unchanged for every tension.",
        values: { bench: 1, supports: 1, pulley: 1, draw: 1, bracket: 1, mass: 0.44, tension: 0, midpoint: 0, phone: 0, sound: 0, final: 0, record: 0, vibe: 0, marker: 0, glow: 0, massLevel: 0, recordLevel: 0 }
      },
      {
        text: "The first hanging mass gives the first known tension.",
        values: { bench: 1, supports: 1, pulley: 1, draw: 1, bracket: 1, mass: 1, tension: 1, massLabels: 1, midpoint: 0, phone: 0, sound: 0, final: 0, record: 0, vibe: 0, marker: 0, glow: 0, massLevel: 1, recordLevel: 1 }
      },
      {
        text: "Pull the midpoint by the same small distance and release.",
        values: { bench: 1, supports: 1, pulley: 1, draw: 1, bracket: 1, mass: 1, tension: 1, massLabels: 1, midpoint: 1, phone: 0.45, sound: 0, final: 0, record: 0, vibe: 1, marker: 1, glow: 0.24, massLevel: 1, recordLevel: 1 }
      },
      {
        text: "Record data set 1 of 7: the phone reads the fundamental frequency.",
        values: { ...base, massLevel: 1, recordLevel: 1 }
      },
      {
        text: "Add mass, increase tension, and record data set 2 of 7.",
        values: { ...base, massLevel: 2, recordLevel: 2 }
      },
      {
        text: "Add mass again and record data set 3 of 7.",
        values: { ...base, massLevel: 3, recordLevel: 3 }
      },
      {
        text: "Repeat the same pluck and record data set 4 of 7.",
        values: { ...base, massLevel: 4, recordLevel: 4 }
      },
      {
        text: "Increase the hanging mass and record data set 5 of 7.",
        values: { ...base, massLevel: 5, recordLevel: 5 }
      },
      {
        text: "Increase the tension again and record data set 6 of 7.",
        values: { ...base, massLevel: 6, recordLevel: 6 }
      },
      {
        text: "Finish with data set 7 of 7, then linearise the graph.",
        values: { ...base, massLevel: 7, recordLevel: 7 }
      }
    ];

    const cameraShots = [
      { x: 0, y: 0, s: 1 },
      { x: 0, y: 0, s: 1 },
      { x: -120, y: -120, s: 1.12 },
      { x: -90, y: -110, s: 1.10 },
      { x: -250, y: -275, s: 1.28 },
      { x: -125, y: -135, s: 1.15 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 },
      { x: -560, y: -480, s: 1.55 }
    ];

    const captionLayouts = [
      { x: "6vw", y: "5vh", w: "560px", titleO: 1, titleScale: 1 },
      { x: "6vw", y: "5vh", w: "540px", titleO: 1, titleScale: 1 },
      { x: "5vw", y: "4vh", w: "520px", titleO: 0, titleScale: 0.9 },
      { x: "5vw", y: "4vh", w: "500px", titleO: 0, titleScale: 0.86 },
      { x: "5vw", y: "4vh", w: "480px", titleO: 0, titleScale: 0.82 },
      { x: "5vw", y: "4vh", w: "470px", titleO: 0, titleScale: 0.84 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 },
      { x: "6vw", y: "5vh", w: "360px", titleO: 0, titleScale: 0.72 }
    ];

    const formulaCards = [
      null,
      null,
      null,
      { tex: "\\(L=0.600\\,\\mathrm{m}\\)", note: "The controlled vibrating length.", x: "6vw", y: "72vh", w: "300px" },
      { tex: "\\(F_T=mg\\)", note: "The hanging mass supplies the known tension.", x: "6vw", y: "72vh", w: "320px" },
      { tex: "\\(\\Delta y=1.0\\,\\mathrm{cm}\\)", note: "The pluck displacement is kept constant.", x: "6vw", y: "72vh", w: "340px" },
      { tex: "\\(f_1=\\frac{1}{2L}\\sqrt{\\frac{F_T}{\\mu}}\\)", note: "Record the fundamental peak.", x: "6vw", y: "43vh", w: "310px" },
      { tex: "\\(F_T\\uparrow\\Rightarrow f_1\\uparrow\\)", note: "Add mass, record again.", x: "6vw", y: "43vh", w: "300px" },
      { tex: "\\(F_T=mg\\)", note: "Each new mass gives a new tension.", x: "6vw", y: "43vh", w: "300px" },
      { tex: "\\(f_1=\\frac{1}{2L}\\sqrt{\\frac{F_T}{\\mu}}\\)", note: "Keep the same length and same pluck.", x: "6vw", y: "43vh", w: "310px" },
      { tex: "\\(f_1^2\\propto F_T\\)", note: "The linear pattern begins to appear.", x: "6vw", y: "43vh", w: "300px" },
      { tex: "\\(\\Delta(f^2)=2f\\,\\Delta f\\)", note: "Frequency uncertainty becomes vertical error bars.", x: "6vw", y: "43vh", w: "310px" },
      { tex: "\\(f_1^2\\text{ vs }F_T\\)", note: "The final graph should be close to a straight line.", x: "6vw", y: "43vh", w: "300px" }
    ];

    function initialSceneFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = Number(params.get("step"));
      if (!Number.isFinite(raw)) return 0;
      return Math.max(0, Math.min(scenes.length - 1, Math.round(raw) - 1));
    }

    let activeScene = initialSceneFromUrl();
    let narrationTimer = 0;

    function setOpacity(el, value) {
      if (!el) return;
      el.style.setProperty("--o", Number(value || 0).toFixed(3));
    }

    function setVibe(value) {
      const v = Number(value || 0).toFixed(3);
      parts.stringGhost.style.setProperty("--vibe", v);
      parts.stringEnvelopeUp.style.setProperty("--vibe", v);
      parts.stringEnvelopeDown.style.setProperty("--vibe", v);
    }

    // f1 = (1/2L)·sqrt(F_T/mu), matching the simulated report: L = 0.600 m,
    // mu = 8.0e-5 kg/m, one 50 g set per record, so f1 = 65 Hz·sqrt(n).
    // The ghost wave replays it in slow motion (÷55) to keep cycles visible.
    const PHYS = { L: 0.6, MU: 8.0e-5, SET_KG: 0.05, G: 9.81, SLOWMO: 55 };
    // Visual stretch per 50 g set (Hooke: extension ∝ n). 4 px × 7 sets puts
    // the lowest slotted mass right at the floor line (y = 800), not past it.
    const TAIL = { length: 129, extPerSet: 4 };

    function fundamentalHz(sets) {
      if (!sets || sets <= 0) return 0;
      return Math.sqrt(sets * PHYS.SET_KG * PHYS.G / PHYS.MU) / (2 * PHYS.L);
    }

    function setStretch(level) {
      const n = Math.max(0, Math.min(7, Math.round(level || 0)));
      const ext = n * TAIL.extPerSet;
      parts.massCarriage.style.transform = `translateY(${ext}px)`;
      parts.stringTail.style.transform = `scaleY(${((TAIL.length + ext) / TAIL.length).toFixed(4)})`;
      const gauge = (7 - 0.45 * n).toFixed(2);
      parts.stringMain.style.strokeWidth = gauge;
      parts.stringTail.style.strokeWidth = gauge;
      parts.stringGhost.style.strokeWidth = (4 - 0.26 * n).toFixed(2);
    }

    function setPhoneReadout(level) {
      const f = fundamentalHz(level);
      if (parts.phoneFreq) {
        parts.phoneFreq.textContent = f > 0 ? `${Math.round(f)} Hz` : "-- Hz";
      }
      const tempo = f > 0 ? Math.round(900 / Math.sqrt(level)) : 900;
      parts.wavebars.forEach((bar) => {
        bar.style.animationDuration = `${tempo}ms`;
      });
    }

    let ghostOn = false;
    let ghostHz = 0;
    let ghostPhase = 0;
    let ghostLast = performance.now();

    function ghostFrame(now) {
      const dt = Math.min((now - ghostLast) / 1000, 0.05);
      ghostLast = now;
      if (ghostOn && ghostHz > 0) {
        ghostPhase += dt * ghostHz * 2 * Math.PI;
        const mid = (407 + 63 * Math.cos(ghostPhase)).toFixed(1);
        parts.stringGhost.setAttribute("d", `M224 407 C385 ${mid} 705 ${mid} 866 407`);
      }
      requestAnimationFrame(ghostFrame);
    }
    requestAnimationFrame(ghostFrame);

    function setMassLevel(level) {
      const count = Math.max(0, Math.min(7, Math.round(level || 0)));
      parts.massLayers.forEach((layer, index) => {
        layer.style.setProperty("--layer-o", index < count ? "1" : "0");
      });
      if (parts.massCount) {
        parts.massCount.textContent = count > 0 ? `mass set ${count} / 7` : "mass set 0 / 7";
      }
    }

    function setRecordLevel(level) {
      const count = Math.max(0, Math.min(7, Math.round(level || 0)));
      if (parts.recordNumber) {
        parts.recordNumber.textContent = count > 0 ? `record ${count} / 7` : "record 0 / 7";
      }
    }

    function applyCamera(index) {
      const shot = cameraShots[index] || cameraShots[0];
      film.style.setProperty("--cam-x", `${shot.x}px`);
      film.style.setProperty("--cam-y", `${shot.y}px`);
      film.style.setProperty("--cam-s", shot.s);
    }

    function applyCaptionLayout(index) {
      const layout = captionLayouts[index] || captionLayouts[0];
      film.style.setProperty("--caption-x", layout.x);
      film.style.setProperty("--caption-y", layout.y);
      film.style.setProperty("--caption-w", layout.w);
      film.style.setProperty("--title-o", layout.titleO);
      film.style.setProperty("--title-scale", layout.titleScale);
    }

    async function renderFormula(index) {
      const card = formulaCards[index];
      if (!card) {
        film.style.setProperty("--formula-o", "0");
        return;
      }

      film.style.setProperty("--formula-x", card.x);
      film.style.setProperty("--formula-y", card.y);
      film.style.setProperty("--formula-w", card.w);
      parts.formulaText.textContent = card.tex;
      parts.formulaNote.textContent = card.note;
      film.style.setProperty("--formula-o", "1");

      if (window.MathJax?.typesetPromise) {
        try {
          await window.MathJax.typesetPromise([parts.formulaText]);
        } catch {
          // Keep the TeX visible if MathJax is unavailable.
        }
      }
    }

    function applyScene(index, immediate = false) {
      const scene = scenes[index];
      const values = scene.values;
      applyCamera(index);
      applyCaptionLayout(index);
      renderFormula(index);

      window.clearTimeout(narrationTimer);
      if (immediate) {
        narration.textContent = scene.text;
      } else {
        narration.classList.add("fading");
        narrationTimer = window.setTimeout(() => {
          narration.textContent = scene.text;
          narration.classList.remove("fading");
        }, 180);
      }

      chapter.textContent = `${String(index + 1).padStart(2, "0")} / ${String(scenes.length).padStart(2, "0")}`;
      root.style.setProperty("--chapter-progress", ((index + 1) / scenes.length).toFixed(3));

      setOpacity(parts.bench, values.bench);
      setOpacity(parts.supports, values.supports);
      setOpacity(parts.pulley, values.pulley);
      setOpacity(parts.lengthBracket, values.bracket);
      setOpacity(parts.mass, values.mass);
      setOpacity(parts.massLabels, values.massLabels);
      setOpacity(parts.tensionArrow, values.tension);
      setOpacity(parts.midpoint, values.midpoint);
      setOpacity(parts.phone, values.phone);
      setOpacity(parts.sound, values.sound);
      setOpacity(parts.finalLabels, values.final);
      setOpacity(parts.recordBadge, values.record);

      parts.stringMain.style.setProperty("--draw", Number(values.draw || 0).toFixed(3));
      parts.stringTail.style.setProperty("--draw", (values.draw || 0) >= 1 ? "1" : "0");
      parts.marker.style.setProperty("--marker", Number(values.marker || 0).toFixed(3));
      // Set on the group so the glow rect, wavebars and readout all inherit it.
      parts.phone.style.setProperty("--phone-glow", Number(values.glow || 0).toFixed(3));
      setVibe(values.vibe);
      setMassLevel(values.massLevel);
      setRecordLevel(values.recordLevel);
      setStretch(values.massLevel);
      setPhoneReadout(values.massLevel);
      ghostOn = (values.vibe || 0) > 0;
      ghostHz = fundamentalHz(values.massLevel) / PHYS.SLOWMO;
    }

    function go(delta) {
      const next = Math.max(0, Math.min(scenes.length - 1, activeScene + delta));
      if (next === activeScene) return;
      activeScene = next;
      applyScene(activeScene);
    }

    film.addEventListener("click", () => go(1));
    film.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        event.preventDefault();
        go(1);
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        go(-1);
      }
    });

    film.focus({ preventScroll: true });
    applyScene(activeScene, true);
    window.addEventListener("load", () => renderFormula(activeScene));
  </script>
</body>
</html>
